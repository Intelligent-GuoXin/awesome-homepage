<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* =========================================================
   HOSHINO MART — 雨夜街角微缩模型
   全部几何/贴图由代码程序化生成
   ========================================================= */

const T = THREE;
const rnd = (a = 0, b = 1) => a + Math.random() * (b - a);
const rndInt = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------------- renderer ---------------- */
const canvas = document.getElementById('scene');
const renderer = new T.WebGLRenderer({
  canvas, antialias: true, powerPreference: 'high-performance', stencil: false
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.88;
renderer.shadowMap.enabled = false;
renderer.shadowMap.type = T.PCFSoftShadowMap;

const scene = new T.Scene();
scene.fog = new T.FogExp2(0x0a121f, 0.0165);

const camera = new T.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 400);
camera.position.set(15.2, 8.8, 15.9);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.0, 2.0, 0.0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.enablePan = false;
controls.minDistance = 9;
controls.maxDistance = 46;
controls.minPolarAngle = 0.10;
controls.maxPolarAngle = Math.PI * 0.495;
controls.rotateSpeed = 0.72;
controls.zoomSpeed = 0.85;

/* ---------------- post ---------------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new T.Vector2(window.innerWidth, window.innerHeight), 0.34, 0.62, 0.95
);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ---------------- 三渲二：阶梯渐变贴图 ---------------- */
function gradientMap(steps) {
  const data = new Uint8Array(steps.map(s => Math.max(0, Math.min(255, Math.round(s * 255)))));
  const t = new T.DataTexture(data, steps.length, 1, T.RedFormat);
  t.minFilter = T.NearestFilter;
  t.magFilter = T.NearestFilter;
  t.generateMipmaps = false;
  t.needsUpdate = true;
  return t;
}
const GRAD_SOFT = gradientMap([0.30, 0.52, 0.72, 0.86, 1.0]);
const GRAD_HARD = gradientMap([0.36, 0.62, 0.86, 1.0]);
const GRAD_FLAT = gradientMap([0.42, 0.74, 1.0]);

/* ---------------- 卡通材质工厂 ---------------- */
function toon(color, opt = {}) {
  const key = color + '|' + JSON.stringify(opt.key || opt);
  const m = new T.MeshToonMaterial({
    color,
    gradientMap: opt.flat ? GRAD_FLAT : (opt.hard ? GRAD_HARD : GRAD_SOFT),
    emissive: opt.emissive !== undefined ? opt.emissive : 0x000000,
    emissiveIntensity: opt.ei !== undefined ? opt.ei : 1,
    map: opt.map || null,
    emissiveMap: opt.emap || null,
    transparent: !!opt.transparent,
    opacity: opt.opacity !== undefined ? opt.opacity : 1,
    side: opt.side || T.FrontSide,
    alphaTest: opt.alphaTest || 0,
    depthWrite: opt.depthWrite !== undefined ? opt.depthWrite : true
  });
  if (opt.map) { m.map.colorSpace = T.SRGBColorSpace; }
  if (opt.emap) { m.emissiveMap.colorSpace = T.SRGBColorSpace; }
  return m;
}

/* ---------------- 描边（反向壳） ---------------- */
function makeOutMat(thick) {
  return new T.ShaderMaterial({
    uniforms: { uThick: { value: thick }, uColor: { value: new T.Color(0x060a12) } },
    vertexShader: `
      uniform float uThick;
      void main(){
        vec3 p = position + normalize(normal) * uThick;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
      }`,
    fragmentShader: `
      uniform vec3 uColor;
      void main(){ gl_FragColor = vec4(uColor, 1.0); }`,
    side: T.BackSide
  });
}
const OUT_BIG = makeOutMat(0.042);
const OUT_MID = makeOutMat(0.028);
const OUT_SMALL = makeOutMat(0.018);
function outline(mesh, mat = OUT_MID) {
  if (!mesh || !mesh.isMesh) return mesh;
  const m = new T.Mesh(mesh.geometry, mat);
  m.castShadow = false; m.receiveShadow = false;
  m.renderOrder = -1;
  mesh.add(m);
  mesh.userData.outline = m;
  return mesh;
}

/* ---------------- 场景容器 ---------------- */
const world = new T.Group();
scene.add(world);

/* 简易建盒 */
function box(w, h, d, mat, x, y, z, ry = 0) {
  const m = new T.Mesh(new T.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  if (ry) m.rotation.y = ry;
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function cyl(rt, rb, h, seg, mat, x, y, z) {
  const m = new T.Mesh(new T.CylinderGeometry(rt, rb, h, seg), mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function plane(w, h, mat, x, y, z, rx = 0, ry = 0) {
  const m = new T.Mesh(new T.PlaneGeometry(w, h), mat);
  m.position.set(x, y, z);
  m.rotation.set(rx, ry, 0);
  return m;
}

/* =========================================================
   Canvas 贴图工厂
   ========================================================= */
function C(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}
function tex(canvas, rx = 1, ry = 1, srgb = true) {
  const t = new T.CanvasTexture(canvas);
  t.wrapS = t.wrapT = T.RepeatWrapping;
  t.repeat.set(rx, ry);
  t.anisotropy = 8;
  if (srgb) t.colorSpace = T.SRGBColorSpace;
  return t;
}
function noise(ctx, w, h, n, alpha, size) {
  for (let i = 0; i < n; i++) {
    const g = rndInt(10, 70);
    ctx.fillStyle = `rgba(${g},${g + 3},${g + 8},${alpha * Math.random()})`;
    ctx.beginPath();
    ctx.arc(rnd(0, w), rnd(0, h), rnd(size * 0.3, size), 0, 7);
    ctx.fill();
  }
}
function sparkle(ctx, cx, cy, r, color) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(cx, cy - r);
  ctx.quadraticCurveTo(cx + r * 0.16, cy - r * 0.16, cx + r, cy);
  ctx.quadraticCurveTo(cx + r * 0.16, cy + r * 0.16, cx, cy + r);
  ctx.quadraticCurveTo(cx - r * 0.16, cy + r * 0.16, cx - r, cy);
  ctx.quadraticCurveTo(cx - r * 0.16, cy - r * 0.16, cx, cy - r);
  ctx.fill();
  ctx.restore();
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* --- 沥青 --- */
function texAsphalt() {
  const c = C(512, 512), x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 512, 512);
  g.addColorStop(0, '#2a2e36'); g.addColorStop(0.5, '#22262d'); g.addColorStop(1, '#1c2027');
  x.fillStyle = g; x.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 5200; i++) {
    const v = rndInt(26, 78);
    x.fillStyle = `rgba(${v},${v + 2},${v + 7},${rnd(0.06, 0.5)})`;
    x.beginPath(); x.arc(rnd(0, 512), rnd(0, 512), rnd(0.4, 2.2), 0, 7); x.fill();
  }
  // 修补痕迹
  for (let i = 0; i < 5; i++) {
    x.strokeStyle = `rgba(12,14,18,${rnd(0.25, 0.5)})`;
    x.lineWidth = rnd(1.5, 4);
    x.beginPath();
    let px = rnd(0, 512), py = rnd(0, 512);
    x.moveTo(px, py);
    for (let k = 0; k < 6; k++) { px += rnd(-40, 40); py += rnd(-40, 40); x.lineTo(px, py); }
    x.stroke();
  }
  // 浅色磨损
  for (let i = 0; i < 8; i++) {
    const rr = rnd(20, 90);
    const gr = x.createRadialGradient(rnd(0, 512), rnd(0, 512), 0, 256, 256, rr);
    x.fillStyle = 'rgba(120,130,145,0.035)';
    x.beginPath(); x.arc(rnd(0, 512), rnd(0, 512), rr, 0, 7); x.fill();
  }
  return c;
}

/* --- 人行道地砖 --- */
function texSidewalk() {
  const c = C(512, 512), x = c.getContext('2d');
  x.fillStyle = '#3b4048'; x.fillRect(0, 0, 512, 512);
  const n = 4, s = 512 / n;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const v = rndInt(66, 86);
    x.fillStyle = `rgb(${v},${v + 3},${v + 8})`;
    x.fillRect(i * s + 3, j * s + 3, s - 6, s - 6);
    // 砖面颗粒
    for (let k = 0; k < 130; k++) {
      const g2 = rndInt(60, 130);
      x.fillStyle = `rgba(${g2},${g2},${g2 + 5},${rnd(0.05, 0.3)})`;
      x.fillRect(i * s + rnd(4, s - 4), j * s + rnd(4, s - 4), rnd(1, 3), rnd(1, 3));
    }
    // 高光边
    x.strokeStyle = 'rgba(190,200,210,0.12)';
    x.lineWidth = 1;
    x.strokeRect(i * s + 3.5, j * s + 3.5, s - 7, s - 7);
    // 边缘暗角
    const gr = x.createLinearGradient(i * s, j * s, i * s + s, j * s + s);
    gr.addColorStop(0, 'rgba(0,0,0,0)');
    gr.addColorStop(1, `rgba(0,0,0,${rnd(0.05, 0.22)})`);
    x.fillStyle = gr; x.fillRect(i * s + 3, j * s + 3, s - 6, s - 6);
  }
  noise(x, 512, 512, 2600, 0.16, 1.6);
  return c;
}

/* --- 自动贩卖机正面 --- */
function texVending(hue) {
  const c = C(512, 1024), x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 1024);
  g.addColorStop(0, '#f7fbff');
  g.addColorStop(1, '#dbe7f2');
  x.fillStyle = g; x.fillRect(0, 0, 512, 1024);

  // 顶部品牌条
  x.fillStyle = '#12305c';
  x.fillRect(0, 0, 512, 96);
  x.fillStyle = '#ffffff';
  x.font = '900 46px "Arial Black",Impact,sans-serif';
  x.textBaseline = 'middle';
  x.fillText('HOSHINO', 26, 50);
  x.fillStyle = '#7ee6b0';
  x.font = '900 46px "Arial Black",Impact,sans-serif';
  x.fillText('DRINK', 300, 50);

  // 饮料陈列区
  const cols = 4, rows = 4;
  const gx = 26, gy = 116, cw = 112, ch = 176;
  const palette = [
    ['#e8452f', '#ff8a5c'], ['#2f7fe8', '#62c2ff'], ['#f2c238', '#ffe58a'],
    ['#38a05a', '#7fe8a0'], ['#8e4fd6', '#c79cff'], ['#e85f9c', '#ffa8cc'],
    ['#2fb0a0', '#8ce8dc'], ['#d4dbe4', '#ffffff'], ['#1e2a44', '#5a6f96'],
    ['#f08b2a', '#ffc484'], ['#7a4a2a', '#c9a07a'], ['#4a86c8', '#a8d4ff']
  ];
  for (let r = 0; r < rows; r++) {
    for (let cI = 0; cI < cols; cI++) {
      const px = gx + cI * (cw + 8);
      const py = gy + r * (ch + 6);
      // 货道背景
      x.fillStyle = 'rgba(180,205,225,0.35)';
      x.fillRect(px, py, cw, ch - 26);
      // 饮料瓶身
      const p = pick(palette);
      const bw = 62, bh = 116;
      const bx = px + (cw - bw) / 2, by = py + ch - 40 - bh;
      const bg = x.createLinearGradient(bx, 0, bx + bw, 0);
      bg.addColorStop(0, p[0]); bg.addColorStop(0.38, p[1]); bg.addColorStop(1, p[0]);
      x.fillStyle = bg;
      roundRect(x, bx, by + 12, bw, bh - 12, 8); x.fill();
      // 瓶盖
      x.fillStyle = 'rgba(255,255,255,0.9)';
      x.fillRect(bx + bw * 0.32, by, bw * 0.36, 14);
      // 标签
      x.fillStyle = 'rgba(255,255,255,0.94)';
      x.fillRect(bx + 3, by + 44, bw - 6, 42);
      x.fillStyle = 'rgba(20,30,45,0.75)';
      for (let l = 0; l < 3; l++) x.fillRect(bx + 8, by + 52 + l * 9, rnd(12, bw - 20), 3);
      // 高光
      x.fillStyle = 'rgba(255,255,255,0.42)';
      x.fillRect(bx + 8, by + 18, 7, bh - 26);
      // 价格条
      x.fillStyle = '#ffe066';
      x.fillRect(px, py + ch - 34, cw, 26);
      x.fillStyle = '#20304a';
      x.font = '700 20px "Arial",sans-serif';
      x.textAlign = 'center';
      x.fillText('¥' + (110 + r * 30 + cI * 10), px + cw / 2, py + ch - 16);
      x.textAlign = 'left';
    }
  }

  // 按钮/投币区
  x.fillStyle = '#e7eef8';
  x.fillRect(0, 838, 512, 84);
  for (let i = 0; i < 8; i++) {
    x.fillStyle = i % 3 === 0 ? '#ff5a4a' : '#3b6fb5';
    roundRect(x, 26 + i * 58, 858, 44, 20, 6); x.fill();
  }
  x.fillStyle = '#182c47';
  x.fillRect(26, 890, 220, 18);
  x.fillStyle = '#8fa6c4';
  x.fillRect(400, 852, 14, 58);

  // 取物口
  x.fillStyle = '#141a24';
  x.fillRect(24, 934, 464, 68);
  x.fillStyle = 'rgba(255,255,255,0.08)';
  x.fillRect(34, 944, 444, 12);

  // 顶部反光
  const gl = x.createLinearGradient(0, 0, 512, 400);
  gl.addColorStop(0, 'rgba(255,255,255,0.28)');
  gl.addColorStop(0.5, 'rgba(255,255,255,0)');
  x.fillStyle = gl; x.fillRect(0, 96, 512, 360);
  return c;
}

/* --- 货架商品墙 --- */
function texProducts(w = 1024, h = 512, rows = 5) {
  const c = C(w, h), x = c.getContext('2d');
  x.fillStyle = '#e8e2d4'; x.fillRect(0, 0, w, h);
  const pal = [
    '#e14b3c', '#e88b2c', '#f2c53d', '#69a94f', '#3d8fc0', '#4463a8',
    '#9a5cc0', '#d95b93', '#c8474a', '#8a6a4a', '#e8e2d0', '#4a4f5a'
  ];
  const rowH = h / rows;
  for (let r = 0; r < rows; r++) {
    const top = r * rowH;
    // 背板
    x.fillStyle = r % 2 ? '#ded7c6' : '#e3dccb';
    x.fillRect(0, top, w, rowH);
    // 商品
    let px = 8;
    while (px < w - 10) {
      const bw = rnd(24, 46);
      const bh = rowH * rnd(0.58, 0.86);
      const by = top + rowH - bh - rowH * 0.12;
      const col = pick(pal);
      x.fillStyle = col;
      roundRect(x, px, by, bw, bh, 3); x.fill();
      // 标签
      x.fillStyle = 'rgba(255,255,255,0.88)';
      x.fillRect(px + 3, by + bh * rnd(0.3, 0.5), bw - 6, bh * 0.22);
      x.fillStyle = 'rgba(30,30,30,0.35)';
      x.fillRect(px + 6, by + bh * 0.36, bw - 12, 3);
      // 明暗
      const sg = x.createLinearGradient(px, 0, px + bw, 0);
      sg.addColorStop(0, 'rgba(255,255,255,0.22)');
      sg.addColorStop(0.4, 'rgba(255,255,255,0)');
      sg.addColorStop(1, 'rgba(0,0,0,0.30)');
      x.fillStyle = sg; x.fillRect(px, by, bw, bh);
      px += bw + rnd(2, 7);
    }
    // 隔板
    x.fillStyle = '#b9b2a2';
    x.fillRect(0, top + rowH - 6, w, 6);
    x.fillStyle = 'rgba(255,255,255,0.55)';
    x.fillRect(0, top + rowH - 7, w, 2);
  }
  // 顶光衰减
  const vg = x.createLinearGradient(0, 0, 0, h);
  vg.addColorStop(0, 'rgba(255,245,220,0.35)');
  vg.addColorStop(1, 'rgba(40,35,30,0.22)');
  x.fillStyle = vg; x.fillRect(0, 0, w, h);
  return c;
}

/* =========================================================
   积水（带波纹着色器）
   ========================================================= */
const puddleUniforms = { uTime: { value: 0 } };
function makePuddle(rx, rz, x, z, y = 0.03, seed = 0) {
  const g = new T.CircleGeometry(1, 40);
  // 打乱顶点使其不规则
  const pos = g.attributes.position;
  for (let i = 2; i < pos.count; i++) {
    const a = Math.atan2(pos.getY(i), pos.getX(i));
    const k = 1 + Math.sin(a * 3 + seed) * 0.13 + Math.sin(a * 5.7 + seed * 2) * 0.09;
    pos.setXY(i, Math.cos(a) * k, Math.sin(a) * k);
  }
  const m = new T.Mesh(g, new T.ShaderMaterial({
    transparent: true, depthWrite: false, blending: T.NormalBlending,
    uniforms: Object.assign({}, puddleUniforms, {
      uSeed: { value: seed },
      uTint: { value: new T.Color(0x1b2a3d) }
    }),
    vertexShader: `varying vec2 vUv; varying vec3 vW;
      void main(){ vUv = uv; vec4 w = modelMatrix*vec4(position,1.0); vW = w.xyz;
      gl_Position = projectionMatrix*viewMatrix*w; }`,
    fragmentShader: `
      uniform float uTime, uSeed; uniform vec3 uTint;
      varying vec2 vUv; varying vec3 vW;
      void main(){
        vec2 p = vUv*2.0-1.0;
        float r = length(p);
        float a = 0.0;
        for(int i=0;i<3;i++){
          float fi = float(i);
          vec2 c = vec2(sin(uSeed*3.1+fi*2.2), cos(uSeed*1.7+fi*3.3))*0.55;
          float d = length(p-c);
          float t = uTime*0.75 + fi*1.7 + uSeed;
          float wv = sin(d*26.0 - t*5.0) * exp(-d*4.5) * smoothstep(0.02, 0.25, d);
          float wv2 = sin(d*14.0 - t*3.0) * exp(-d*3.0) * 0.5;
          a += wv*0.5 + wv2;
        }
        float edge = smoothstep(1.0, 0.55, r);
        vec3 col = uTint + vec3(0.10,0.16,0.24)*max(a,0.0)*0.9;
        float rim = smoothstep(0.70, 0.99, r) * 0.22;
        col += vec3(0.35,0.45,0.6)*rim;
        gl_FragColor = vec4(col, (0.62 + max(a,0.0)*0.35 + rim) * edge);
      }`
  }));
  m.rotation.x = -Math.PI / 2;
  m.scale.set(rx, rz, 1);
  m.position.set(x, y, z);
  m.renderOrder = 2;
  return m;
}

const wetLights = [
  { p: new T.Vector3(2.4, 2.9, 0.4), c: new T.Color(0x7dffbf), i: 0.6 },   // 招牌
  { p: new T.Vector3(1.9, 1.3, -4.6), c: new T.Color(0xa8d8ff), i: 1.1 },  // 贩卖机

  { p: new T.Vector3(0.4, 1.8, 0.7), c: new T.Color(0xffd9a0), i: 1.0 }    // 店内
];
const wetMat = new T.ShaderMaterial({
  transparent: true, depthWrite: false, blending: T.AdditiveBlending,
  uniforms: {
    uCam: { value: new T.Vector3() },
    uLP: { value: wetLights.map(l => l.p) },
    uLC: { value: wetLights.map(l => l.c) },
    uLI: { value: wetLights.map(l => l.i) }
  },
  vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix*vec4(position,1.0); vW = w.xyz;
    gl_Position = projectionMatrix*viewMatrix*w; }`,
  fragmentShader: `
    uniform vec3 uCam; uniform vec3 uLP[4]; uniform vec3 uLC[4]; uniform float uLI[4];
    varying vec3 vW;
    void main(){
      vec3 N = vec3(0.0,1.0,0.0);
      vec3 V = normalize(uCam - vW);
      vec3 col = vec3(0.0);
      for(int i=0;i<4;i++){
        vec3 lv = uLP[i] - vW;
        float d = length(lv);
        vec3 L = lv/d;
        vec3 H = normalize(L+V);
        float spec = pow(max(dot(H,N),0.0), 220.0);
        float fall = 1.0/(1.0 + d*d*0.035);
        col += uLC[i]*spec*fall*uLI[i]*4.2;
      }
      float fres = pow(1.0 - clamp(V.y,0.0,1.0), 5.0);
      col += vec3(0.09,0.13,0.20)*fres;
      gl_FragColor = vec4(col, 1.0);
    }`
});

  x.restore();
  return c;
}

function tubeBetween(a, b, r, mat, seg = 7) {
  const d = new T.Vector3().subVectors(b, a);
  const len = d.length();
  const m = new T.Mesh(new T.CylinderGeometry(r, r, len, seg), mat);
  m.position.copy(a).addScaledVector(d, 0.5);
  m.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), d.clone().normalize());
  m.castShadow = true; m.receiveShadow = true;
  return m;
}

    const sp = new T.Mesh(new T.CylinderGeometry(0.004, 0.004, 0.57, 3), rimMat);

  g.add(new T.Mesh(new T.CylinderGeometry(0.03, 0.03, 0.09, 8), rimMat).rotateZ(Math.PI / 2));
  g.position.set(0, 0.33, z);

}
const ripMesh = new T.Mesh(ripGeo, ripMat);
ripMesh.frustumCulled = false;
ripMesh.renderOrder = 7;
world.add(ripMesh);

/* =========================================================
   动画
   ========================================================= */
const clock = new T.Clock();
let signFlicker = 0;
let lastFlicker = 0;

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  rainMat.uniforms.uTime.value = t;
  dripMat.uniforms.uTime.value = t;
  splashMat.uniforms.uTime.value = t;
  ripMat.uniforms.uTime.value = t;
  puddleUniforms.uTime.value = t;
  wetMat.uniforms.uCam.value.copy(camera.position);

  // 招牌微闪
  if (t - lastFlicker > 2.6 && Math.random() < 0.012) {
    signFlicker = rnd(0.06, 0.18);
    lastFlicker = t;
  }
  let bright = 1.0 + Math.sin(t * 2.1) * 0.015;
  if (signFlicker > 0) {
    signFlicker -= 0.016;
    bright *= Math.random() < 0.5 ? 0.55 : 1.0;
  }
  signMat.color.setScalar(bright);
  signLight.intensity = 14 * bright;
  lampPanelMat.emissiveIntensity = 2.2 + Math.sin(t * 1.3) * 0.05;

  glowSpr.material.opacity = 0.5 + Math.sin(t * 7.0) * 0.03;

  controls.update();
  composer.render();
}
animate();

/* ---------------- resize ---------------- */
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloom.setSize(w, h);
}
window.addEventListener('resize', onResize);

</script>
