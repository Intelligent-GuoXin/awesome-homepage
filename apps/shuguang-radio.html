  --ink: #efe3cf;
  --amber: #ffb45c;

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {

  padding: 0;

  height: 100%;
  overflow: hidden;

#stage {

  inset: 0;
  width: 100%;

.overlay { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
.vignette {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse 78% 68% at 50% 46%, rgba(0,0,0,0) 38%, rgba(0,0,0,0.55) 82%, rgba(0,0,0,0.86) 100%);
}
.grain {
  position: absolute; inset: -50%;
  opacity: 0.045;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='0.9'/></svg>");
  animation: grainShift 1.1s steps(3) infinite;
}
@keyframes grainShift {
  0% { transform: translate(0, 0); }
  33% { transform: translate(-3px, 2px); }
  66% { transform: translate(2px, -3px); }
  100% { transform: translate(0, 0); }
}
.bloomwarm {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse 60% 50% at 62% 44%, rgba(255,150,60,0.05), transparent 70%);
  mix-blend-mode: screen;
  transition: opacity 1.2s ease;
  opacity: 0;
}
body.powered .bloomwarm { opacity: 1; }

/* ---------- 加载屏 ---------- */
#loader {
  position: fixed; inset: 0; z-index: 60;
  background: #070504;
  display: flex; align-items: center; justify-content: center;

}
#loader.gone { opacity: 0; visibility: hidden; }
.ld-inner { text-align: center; }
.ld-brand {
  font-family: var(--kai);
  font-size: 30px; letter-spacing: 0.42em;
  color: #d9c39a;
  text-shadow: 0 0 26px rgba(255,170,80,0.35);
  animation: ldGlow 2.6s ease-in-out infinite;
}
@keyframes ldGlow { 0%,100% { opacity: 0.65; } 50% { opacity: 1; } }
.ld-sub {
  margin-top: 12px; font-size: 11px; letter-spacing: 0.3em;
  color: rgba(217,195,154,0.45);
}
.ld-line {
  width: 148px; height: 1px; margin: 26px auto 0;
  background: rgba(217,195,154,0.14); overflow: hidden;
}
.ld-line i {
  display: block; height: 100%; width: 40%;
  background: linear-gradient(90deg, transparent, var(--amber), transparent);
  animation: ldRun 1.5s ease-in-out infinite;
}
@keyframes ldRun { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
.ld-tip { margin-top: 16px; font-size: 11px; letter-spacing: 0.2em; color: rgba(217,195,154,0.32); }

/* ---------- 标题 ---------- */
.title {
  position: fixed; top: 26px; left: 30px; z-index: 10;

body.ready .title { opacity: 1; transform: none; }

<body>

<canvas id="stage"></canvas>

<!-- 屏幕叠加：暗角 / 颗粒 / 暖色分级 -->
<div class="overlay">
  <div class="vignette"></div>
  <div class="grain"></div>
  <div class="bloomwarm"></div>
</div>

<!-- 加载屏 -->
<div id="loader">
  <div class="ld-inner">
    <div class="ld-brand">曙 光 牌</div>
    <div class="ld-sub">MODEL 7102 · 三波段台式收音机</div>
    <div class="ld-line"><i></i></div>
    <div class="ld-tip">灯丝预热中…</div>
  </div>
</div>

<!-- 标题 -->
<header class="title">
  <h1>曙光 <span>7102</span></h1>
  <p>三波段台式收音机 · 实时合成音频</p>
</header>

<!-- 频率读数 -->
<footer class="readout">
  <div class="ro-band"><span id="bandName">中 波</span></div>
  <div class="ro-main">
    <span id="freq">828</span><span id="unit">kHz</span>
  </div>
  <div class="ro-station" id="station">
    <b id="stName">电源关闭</b>
    <em id="stProg">点击音量旋钮开机</em>
  </div>
</footer>

<!-- 磁带指示 -->
<div class="tape" id="tape">
  <span class="dot"></span>磁带输入 · <b id="tapeName">—</b>
</div>

<!-- 说明 / 引导 -->
<div class="hint" id="hint">
  <div class="hint-card">
    <div class="hint-head"><b>使用说明</b><span class="hint-x" id="hintClose">✕</span></div>
    <div class="hint-row"><i class="k">①</i><span>点击<strong>音量旋钮</strong>开机</span></div>
    <div class="hint-row"><i class="k">②</i><span>按住<strong>调谐旋钮</strong>绕着转找台（Shift 更精细）</span></div>
    <div class="hint-row"><i class="k">③</i><span>右上<strong>节目表</strong>一键选台，或按 <strong>[ ]</strong> 换台</span></div>
    <div class="hint-row"><i class="k">④</i><span>拨动<strong>波段拨杆</strong>切换中波 / 短波</span></div>
    <div class="hint-row"><i class="k">⑤</i><span>把<strong>本地音频</strong>拖进页面，当作一盘磁带</span></div>
    <div class="hint-foot">空格开关机 · 方向键微调 · 滚轮缩放视角<br>调准了会响起呼号音，猫眼管合拢成一条缝。</div>
    <button class="hint-btn" id="powerBtn">开 机</button>
  </div>
</div>

<!-- 右上工具 -->
<div class="tools">
  <button class="tbtn" id="listBtn">节目表</button>
  <button class="tbtn" id="helpBtn">说明</button>
</div>

<!-- 节目表 / 快捷调频 -->
<aside class="panel" id="panel">
  <div class="panel-head">
    <b>节 目 表</b>
    <i id="panelBand">中波 kHz</i>
    <span class="panel-x" id="panelClose">✕</span>
  </div>
  <ul class="plist" id="plist"></ul>
  <div class="panel-foot">
    <button id="seekPrev">‹ 上一个</button>
    <button id="seekBtn">自动搜索 ›</button>
  </div>
</aside>

<div class="toast" id="toast"></div>
<div class="dropzone"><div>松手，把它装进收音机</div></div>
