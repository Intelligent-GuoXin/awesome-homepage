<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intelligent-GuoXin</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23141413'/><text x='16' y='22' text-anchor='middle' fill='%23FAF9F5' font-family='Georgia,serif' font-size='14' font-weight='600'>GX</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Noto+Serif+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF9F5;          --paper:#FFFFFF;
    --ink:#141413;         --ink-2:#3A3A38;
    --muted:#76746E;       --line:#E8E5DD;
    --line-strong:#D6D2C7;
    --accent:#C75F2C;      --accent-soft:#F4E8DD;   --accent-ink:#8B3E14;
    --ok:#3B7A4B;
    --code-bg:#1F1E1B;     --code-ink:#EAE8E1;      --code-muted:#7A7770;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:"Inter Tight","Inter",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:15.5px;line-height:1.7;-webkit-font-smoothing:antialiased;
  }
  .serif{font-family:"Fraunces","Noto Serif SC",Georgia,"Times New Roman",serif;}
  .serif-zh{font-family:"Noto Serif SC","Fraunces",Georgia,serif;}

  /* ---------- Topbar ---------- */
  .topbar{
    position:sticky;top:0;z-index:50;
    background:rgba(250,249,245,.86);
    backdrop-filter:saturate(140%) blur(14px);
    -webkit-backdrop-filter:saturate(140%) blur(14px);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{
    max-width:1240px;margin:0 auto;padding:14px 36px;
    display:flex;align-items:center;justify-content:space-between;gap:24px;
  }
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);}
  .brand-mark{
    width:26px;height:26px;border-radius:8px;background:var(--ink);
    display:grid;place-items:center;color:var(--bg);
    font-family:"Fraunces",serif;font-size:15px;font-weight:500;letter-spacing:-.5px;
  }
  .brand-name{font-weight:600;letter-spacing:-.2px;font-size:14.5px;}
  .brand-sep{color:var(--line-strong);margin:0 4px;}
  .brand-sub{color:var(--muted);font-size:13.5px;}
  .topbar-right{display:flex;align-items:center;gap:20px;}
  .clock-display{text-align:right;}
  .clock-time{font-family:"Fraunces",serif;font-size:18px;font-weight:500;color:var(--ink);letter-spacing:-.5px;font-variant-numeric:tabular-nums;}
  .clock-date{font-size:12px;color:var(--muted);margin-top:-1px;}

  /* ---------- Hero ---------- */
  .hero{max-width:1240px;margin:0 auto;padding:56px 36px 36px;position:relative;display:flex;gap:48px;align-items:flex-start;}
  .hero-left{flex:1;min-width:0;position:relative;}
  .hero-left::before{
    content:"";position:absolute;left:-36px;top:0;width:3px;height:80px;
    background:linear-gradient(to bottom,var(--accent),var(--accent-soft));
    border-radius:2px;
  }
  .hero-poetry{
    width:320px;flex:none;height:320px;
    background:none;border:none;border-radius:0;
    padding:20px 24px 20px 28px;position:relative;overflow:hidden;
    margin-top:8px;display:flex;flex-direction:column;
    border-left:2px solid var(--accent-soft);
  }
  .poetry-label{
    font-family:"Fraunces",serif;font-size:11.5px;letter-spacing:1.8px;text-transform:uppercase;
    color:var(--accent);font-weight:500;font-style:italic;margin-bottom:18px;
    display:flex;align-items:center;gap:8px;flex:none;
  }
  .poetry-label::before{content:"\2014";color:var(--accent);font-style:normal;}
  .poetry-title{
    font-family:"Fraunces","Noto Serif SC",serif;font-size:19px;font-weight:400;font-style:italic;
    color:var(--ink);margin:0 0 8px;line-height:1.3;flex:none;letter-spacing:-.3px;
  }
  .poetry-meta{
    font-family:"Noto Serif SC",serif;font-size:12.5px;color:var(--muted);margin-bottom:16px;
    display:flex;align-items:center;gap:10px;flex:none;letter-spacing:.5px;
  }
  .poetry-meta .dot{width:3px;height:3px;background:var(--accent);border-radius:50%;flex:none;opacity:.6;}
  .poetry-content{
    font-family:"Noto Serif SC",serif;font-size:14.5px;line-height:2.1;
    color:var(--ink-2);margin:0 0 14px;flex:1;overflow-y:auto;
    -webkit-overflow-scrolling:touch;letter-spacing:.8px;
    scrollbar-width:thin;scrollbar-color:var(--line) transparent;
  }
  .poetry-content::-webkit-scrollbar{width:3px;}
  .poetry-content::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px;}
  .poetry-type{
    font-family:"Fraunces",serif;font-size:11px;color:var(--muted);
    display:inline-block;padding:0;font-weight:400;font-style:italic;
    letter-spacing:1px;flex:none;
  }
  .poetry-type::before{content:"\2014 ";color:var(--line-strong);}
  .poetry-loading{
    font-family:"Fraunces",serif;font-size:13px;color:var(--muted);font-style:italic;
    padding:20px 0;text-align:center;flex:1;letter-spacing:.5px;
    display:flex;align-items:center;justify-content:center;
  }
  .poetry-error{
    font-family:"Fraunces",serif;font-size:12.5px;color:var(--muted);text-align:center;font-style:italic;
    flex:1;display:flex;align-items:center;justify-content:center;
  }
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    color:var(--accent-ink);font-size:12.5px;letter-spacing:1.2px;
    text-transform:uppercase;font-weight:500;margin-bottom:18px;
  }
  .eyebrow::before{content:"";width:18px;height:1px;background:var(--accent);}
  .hero h1{
    margin:0 0 16px;font-family:"Fraunces",Georgia,serif;
    font-size:clamp(36px,5vw,60px);
    line-height:1.1;letter-spacing:-1.5px;font-weight:400;
    color:var(--ink);max-width:16ch;
  }
  .hero h1 em{font-style:italic;color:var(--accent);font-weight:400;}
  .hero .zh{
    font-family:"Noto Serif SC",serif;font-size:17px;color:var(--ink-2);
    max-width:44ch;line-height:1.6;margin:0 0 6px;
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  }
  .hero .zh .sep{width:24px;height:1px;background:var(--line-strong);flex-shrink:0;}
  .hero .meta{margin-top:28px;display:flex;flex-wrap:wrap;gap:24px;color:var(--muted);font-size:13px;}
  .hero .meta b{display:block;font-family:"Fraunces",serif;font-size:28px;font-weight:500;color:var(--ink);letter-spacing:-1px;line-height:1.1;}
  .hero .meta span{display:block;margin-top:2px;}

  /* ---------- Search ---------- */
  .search-bar{max-width:1240px;margin:0 auto;padding:0 36px 32px;}
  .search-inner{
    display:flex;align-items:stretch;
    background:var(--paper);border:1px solid var(--line);border-radius:10px;
    overflow:hidden;transition:border-color .2s,box-shadow .2s;
    box-shadow:0 1px 0 rgba(0,0,0,.02);
  }
  .search-inner:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .search-engines{display:flex;border-right:1px solid var(--line);flex-shrink:0;}
  .engine-btn{
    padding:13px 14px;background:none;border:none;
    color:var(--muted);cursor:pointer;font-size:13px;font-weight:500;
    font-family:inherit;transition:color .15s,background .15s;white-space:nowrap;
  }
  .engine-btn:hover{color:var(--ink-2);background:var(--accent-soft);}
  .engine-btn.active{color:var(--accent-ink);background:var(--accent-soft);font-weight:600;}
  .search-input{
    flex:1;padding:13px 18px;background:none;border:none;outline:none;
    color:var(--ink);font-size:15px;font-family:inherit;
  }
  .search-input::placeholder{color:var(--muted);}
  .search-go{
    flex:none;border:none;cursor:pointer;background:none;
    color:var(--accent);font-size:18px;padding:0 20px;
    transition:color .15s;font-family:inherit;
  }
  .search-go:hover{color:var(--accent-ink);}

  /* ---------- Layout ---------- */
  .wrap{
    max-width:1240px;margin:0 auto;padding:16px 36px 80px;
    display:grid;grid-template-columns:228px 1fr;gap:60px;align-items:start;
  }
  .sidenav{position:sticky;top:84px;border-left:1px solid var(--line);padding:6px 0 6px 18px;}
  .sidenav .nav-title{
    font-size:11px;letter-spacing:1.4px;text-transform:uppercase;
    color:var(--muted);font-weight:500;padding:0 0 12px;margin-left:-18px;padding-left:18px;
  }
  .sidenav a{display:flex;align-items:baseline;gap:10px;padding:7px 0;color:var(--ink-2);text-decoration:none;font-size:13.8px;transition:color .15s;}
  .sidenav a .n{font-family:"Fraunces",serif;color:var(--line-strong);font-size:12px;width:22px;flex:none;font-weight:500;}
  .sidenav a:hover{color:var(--accent-ink);}
  .sidenav a.on{color:var(--ink);font-weight:500;}
  .sidenav a.on .n{color:var(--accent);}
  main{min-width:0;}

  /* ---------- Sections ---------- */
  section.sec{padding:18px 0 14px;margin-bottom:48px;scroll-margin-top:84px;border-top:1px solid var(--line);padding-top:42px;}
  section.sec:first-of-type{border-top:none;padding-top:14px;}
  .sec-head{display:flex;align-items:flex-start;gap:18px;margin-bottom:10px;}
  .sec-num{font-family:"Fraunces",serif;font-size:14px;color:var(--accent);width:32px;flex:none;font-weight:500;padding-top:5px;}
  .sec-head h2{margin:0;font-family:"Fraunces","Noto Serif SC",serif;font-size:28px;font-weight:400;letter-spacing:-.5px;line-height:1.2;color:var(--ink);}
  .sec-head .sub{font-size:13.5px;color:var(--muted);margin-top:5px;font-family:"Inter Tight",sans-serif;}
  .sec-desc{color:var(--ink-2);font-size:14.5px;margin:12px 0 22px;padding-left:50px;max-width:58ch;}

  /* ---------- Link Grid ---------- */
  .link-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;
  }
  .link-card{
    display:flex;align-items:center;gap:12px;
    padding:14px 16px;
    background:var(--paper);border:1px solid var(--line);border-radius:10px;
    text-decoration:none;color:var(--ink);
    transition:border-color .18s,box-shadow .18s,transform .18s;
  }
  .link-card:hover{
    border-color:var(--line-strong);
    box-shadow:0 2px 12px -6px rgba(20,20,19,.12);
    transform:translateY(-1px);
  }
  .link-favicon{
    width:32px;height:32px;border-radius:8px;
    background:#F4F1EA;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;overflow:hidden;
  }
  .link-favicon img{width:18px;height:18px;object-fit:contain;}
  .link-favicon .fallback{font-family:"Fraunces",serif;font-size:14px;font-weight:500;color:var(--accent-ink);}
  .link-info{flex:1;min-width:0;}
  .link-name{font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .link-desc{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
  .link-arrow{
    color:var(--line-strong);font-size:13px;
    opacity:0;transform:translateX(-4px);
    transition:all .18s;flex-shrink:0;
  }
  .link-card:hover .link-arrow{opacity:1;transform:translateX(0);color:var(--accent);}

  /* ---------- Footer ---------- */
  footer{border-top:1px solid var(--line);padding:32px 36px 44px;color:var(--muted);font-size:13px;}
  .foot-inner{max-width:1240px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
  .foot-inner .serif{font-style:italic;}

  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

  @media(max-width:980px){
    .wrap{grid-template-columns:1fr;padding:0 22px 60px;gap:0;}
    .sidenav{display:none;}
    .hero{padding:40px 22px 24px;flex-direction:column;gap:24px;}
    .hero-left::before{display:none;}
    .hero h1{font-size:34px;}
    .hero .zh{flex-direction:column;align-items:flex-start;gap:8px;}
    .hero-poetry{width:100%;}
    .search-bar{padding:0 22px 24px;}
    .search-engines{display:none;}
    .sec-desc,.link-grid{padding-left:0;margin-left:0;}
    .topbar-inner{padding:12px 22px;}
    .clock-display{display:none;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="#" class="brand">
      <span class="brand-mark">GX</span>
      <span class="brand-name">Intelligent-GuoXin</span>
      <span class="brand-sep">/</span>
      <span class="brand-sub">Personal Portal</span>
    </a>
    <div class="topbar-right">
      <div class="clock-display">
        <div class="clock-time" id="clock-time">--:--</div>
        <div class="clock-date" id="clock-date">----</div>
      </div>
    </div>
  </div>
</header>

<section class="hero">
  <div class="hero-left">
    <div class="eyebrow">Intelligent-GuoXin &middot; 2026</div>
    <h1 class="serif">Surviving is easy<br><em>thriving</em> is hard</h1>
    <p class="zh serif-zh">活着很容易<span class="sep"></span>活得精彩很难</p>
    <div class="meta">
      <div><b class="serif" id="stat-links">00</b><span>Links</span></div>
      <div><b class="serif" id="stat-cats">00</b><span>Categories</span></div>
      <div><b class="serif" id="stat-engines">04</b><span>Search Engines</span></div>
    </div>
  </div>
  <div class="hero-poetry" id="poetry-card">
    <div class="poetry-label">Daily Poetry</div>
    <div class="poetry-loading" id="poetry-loading">Loading a poem for you...</div>
    <div id="poetry-body" style="display:none;"></div>
  </div>
</section>

<div class="search-bar">
  <form class="search-inner" id="search-form" target="_blank">
    <div class="search-engines">
      <button type="button" class="engine-btn active" data-engine="google">Google</button>
      <button type="button" class="engine-btn" data-engine="github">GitHub</button>
      <button type="button" class="engine-btn" data-engine="stackoverflow">SO</button>
      <button type="button" class="engine-btn" data-engine="npm">npm</button>
    </div>
    <input type="text" class="search-input" id="search-input" placeholder="Search the web..." autocomplete="off" autofocus>
    <button type="submit" class="search-go">&#8594;</button>
  </form>
</div>

<div class="wrap">
  <aside class="sidenav">
    <div class="nav-title">Contents</div>
    <div id="sidenav-links"></div>
  </aside>
  <main id="main-content"></main>
</div>

<footer>
  <div class="foot-inner">
    <span>Intelligent-GuoXin &middot; <span class="serif">A personal developer portal</span></span>
    <span class="serif">2026 &middot; Built with care</span>
  </div>
</footer>

<div id="sr-live" class="sr-only" aria-live="polite"></div>

<script src="links.js"></script>
<script>
(function(){
  var ENGINES = {
    google: { action: 'https://www.google.com/search', param: 'q', placeholder: 'Search the web...' },
    github: { action: 'https://github.com/search', param: 'q', placeholder: 'Search GitHub...' },
    stackoverflow: { action: 'https://stackoverflow.com/search', param: 'q', placeholder: 'Search Stack Overflow...' },
    npm: { action: 'https://www.npmjs.com/search', param: 'q', placeholder: 'Search npm packages...' },
  };

  var currentEngine = 'google';
  var totalLinks = 0;
  LINKS.forEach(function(c){ totalLinks += c.items.length; });

  document.getElementById('stat-links').textContent = String(totalLinks).padStart(2, '0');
  document.getElementById('stat-cats').textContent = String(LINKS.length).padStart(2, '0');

  function render(){
    var nav = document.getElementById('sidenav-links');
    var main = document.getElementById('main-content');
    var navHtml = '';
    var mainHtml = '';

    LINKS.forEach(function(cat, i){
      var num = String(i + 1).padStart(2, '0');
      var id = 's' + (i + 1);
      navHtml += '<a href="#' + id + '"><span class="n">' + num + '</span>' + cat.category + '</a>';

      var itemsHtml = cat.items.map(function(item){
        var initial = item.name.charAt(0);
        return '<a class="link-card" href="' + item.url + '" target="_blank" rel="noopener noreferrer">' +
          '<div class="link-favicon"><img src="' + item.url + '/favicon.ico" alt="" data-fb="' + initial + '" onerror="faviconFail(this)"></div>' +
          '<div class="link-info"><div class="link-name">' + item.name + '</div><div class="link-desc">' + item.desc + '</div></div>' +
          '<span class="link-arrow">&#8599;</span></a>';
      }).join('');

      mainHtml += '<section class="sec" id="' + id + '">' +
        '<div class="sec-head"><div class="sec-num">' + num + '</div><div><h2>' + cat.category + '</h2><div class="sub">' + cat.sub + '</div></div></div>' +
        '<div class="link-grid">' + itemsHtml + '</div></section>';
    });

    nav.innerHTML = navHtml;
    main.innerHTML = mainHtml;
  }

  function updateClock(){
    var now = new Date();
    var timeStr = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
    var dateStr = now.toLocaleDateString('zh-CN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    document.getElementById('clock-time').textContent = timeStr;
    document.getElementById('clock-date').textContent = dateStr;
  }

  function initSearch(){
    var form = document.getElementById('search-form');
    var input = document.getElementById('search-input');
    var btns = document.querySelectorAll('.engine-btn');

    btns.forEach(function(btn){
      btn.addEventListener('click', function(){
        btns.forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        currentEngine = btn.getAttribute('data-engine');
        var engine = ENGINES[currentEngine];
        input.setAttribute('placeholder', engine.placeholder);
        input.focus();
      });
    });

    form.addEventListener('submit', function(e){
      e.preventDefault();
      var query = input.value.trim();
      if(!query) return;
      var engine = ENGINES[currentEngine];
      window.open(engine.action + '?' + engine.param + '=' + encodeURIComponent(query), '_blank');
    });
  }

  function initSidenav(){
    var links = Array.prototype.slice.call(document.querySelectorAll('.sidenav a'));
    var secs = links.map(function(a){ return document.querySelector(a.getAttribute('href')); });
    function onScroll(){
      var y = window.scrollY + 120, idx = 0;
      secs.forEach(function(s, i){ if(s && s.offsetTop <= y) idx = i; });
      links.forEach(function(a, i){ a.classList.toggle('on', i === idx); });
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }

  function initPoetry(){
    var loading = document.getElementById('poetry-loading');
    var body = document.getElementById('poetry-body');
    fetch('https://poetry.palemoky.com/api/poems/random')
      .then(function(r){ return r.json(); })
      .then(function(json){
        var d = json.data;
        if(!d) throw new Error('no data');
        var lines = d.content.join('<br>');
        body.innerHTML =
          '<div class="poetry-title">' + d.title + '</div>' +
          '<div class="poetry-meta"><span>' + d.dynasty.name + '</span><span class="dot"></span><span>' + d.author.name + '</span></div>' +
          '<div class="poetry-content">' + lines + '</div>' +
          '<span class="poetry-type">' + d.type.name + '</span>';
        loading.style.display = 'none';
        body.style.display = 'flex';
        body.style.flexDirection = 'column';
        body.style.flex = '1';
        body.style.minHeight = '0';
      })
      .catch(function(){
        loading.textContent = '今日无诗，明日再来';
      });
  }

  window.faviconFail = function(img){
    img.style.display = 'none';
    var span = document.createElement('span');
    span.className = 'fallback';
    span.textContent = img.getAttribute('data-fb');
    img.parentElement.appendChild(span);
  };

  render();
  updateClock();
  setInterval(updateClock, 1000);
  initSearch();
  initSidenav();
  initPoetry();

  document.addEventListener('keydown', function(e){
    if(e.key === '/' && document.activeElement.tagName !== 'INPUT'){
      e.preventDefault();
      document.getElementById('search-input').focus();
    }
  });
})();
</script>
</body>
</html>
